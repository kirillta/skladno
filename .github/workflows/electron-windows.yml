name: Electron Windows preview

on:
    pull_request:
    push:
        tags:
            - "v*-preview.*"

permissions:
    contents: read

jobs:
    verify-windows:
        if: github.event_name == 'pull_request'
        runs-on: windows-latest
        timeout-minutes: 20

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Test Electron
              run: npm test --workspace @skladno/electron

            - name: Build packaged application
              run: npm run package:electron

    release-preview:
        if: github.event_name == 'push'
        runs-on: windows-latest
        timeout-minutes: 25
        permissions:
            contents: write

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Verify release version
              run: node scripts/check-electron-release-tag.mjs $env:GITHUB_REF_NAME

            - name: Build installer
              run: npm run make:electron

            - name: Create unsigned prerelease
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  $assets = Get-ChildItem packages/electron/out/make -Recurse -File | Where-Object { $_.Name -match 'setup\.exe$|^RELEASES$|-full\.nupkg$' }
                  $setup = $assets | Where-Object Name -match 'setup\.exe$'
                  $releases = $assets | Where-Object Name -eq 'RELEASES'
                  $package = $assets | Where-Object Name -match '-full\.nupkg$'
                  if ($setup.Count -ne 1 -or $releases.Count -ne 1 -or $package.Count -ne 1) { throw 'Expected exactly one setup executable, RELEASES manifest, and full nupkg.' }
                  gh release create $env:GITHUB_REF_NAME $setup.FullName $releases.FullName $package.FullName --prerelease --title "Skladno $env:GITHUB_REF_NAME" --notes "Unsigned Windows 11 x64 preview with unsigned updater. Windows may show a SmartScreen warning. Signing remains tracked in issue #168."
