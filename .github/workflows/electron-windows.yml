name: Electron Windows preview

on:
    pull_request:
    push:
        tags:
            - "v*-preview.*"

permissions:
    contents: read

jobs:
    verify-windows:
        if: github.event_name == 'pull_request'
        runs-on: windows-latest
        timeout-minutes: 20

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Test Electron
              run: npm test --workspace @skladno/electron

            - name: Build packaged application
              run: npm run package:electron

    release-preview:
        if: github.event_name == 'push'
        runs-on: windows-latest
        timeout-minutes: 25
        permissions:
            contents: write

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Verify release version
              run: node scripts/check-electron-release-tag.mjs $env:GITHUB_REF_NAME

            - name: Build installer
              run: npm run make:electron

            - name: Publish unsigned prerelease
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  $artifact = Get-ChildItem packages/electron/out/make -Filter '*setup.exe' -Recurse | Select-Object -First 1
                  if (-not $artifact) { throw 'Skladno setup executable was not produced.' }
                  gh release create $env:GITHUB_REF_NAME $artifact.FullName --prerelease --title "Skladno $env:GITHUB_REF_NAME" --notes "Unsigned Windows 11 x64 preview. Windows may show a SmartScreen warning. Signing and automatic updates remain tracked in issue #35."
